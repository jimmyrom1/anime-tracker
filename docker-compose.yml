services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime
      POSTGRES_DB: anime_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Database=anime_tracker;Username=anime;Password=anime
      App__TimeZone: Europe/Madrid
    volumes:
      # Claves con las que se firman los tokens de sesión. Si se perdieran al recrear el
      # contenedor, todos los usuarios tendrían que volver a iniciar sesión.
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      # La imagen de ASP.NET no trae curl ni wget: se usa /dev/tcp de bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      retries: 20

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
  dataprotection:
