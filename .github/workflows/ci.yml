name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET (tests contra PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime
          POSTGRES_DB: anime_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anime"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Database=anime_test;Username=anime;Password=anime
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      # Warnings como errores: el código se queda limpio.
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test --no-build
      - name: Las migraciones cubren el modelo (no falta ninguna)
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/AnimeTracker.Api

  frontend:
    name: Angular (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait
      - name: Smoke test a través de Nginx
        run: |
          curl -fsS localhost:8080/api/health
          # La SPA responde en sus rutas
          curl -fsS localhost:8080/lista/anime | grep -q '<app-root'
          # Sin token la lista es privada
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/api/list?type=Anime')" = 401
          # Registro, login y búsqueda en el catálogo real de AniList
          curl -fsS -X POST localhost:8080/api/auth/register -H 'Content-Type: application/json' -d '{"email":"ci@test.local","password":"Contrasena123"}'
          TOKEN=$(curl -fsS -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@test.local","password":"Contrasena123"}' | jq -r .accessToken)
          curl -fsS 'localhost:8080/api/catalog/search?type=Anime&q=frieren' -H "Authorization: Bearer $TOKEN" | jq -e 'length > 0'
      - name: Logs si falla
        if: failure()
        run: docker compose logs
